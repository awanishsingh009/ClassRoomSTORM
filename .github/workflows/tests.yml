name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check command-line entry points
        run: |
          python apps/ClassRoomSTORM_Studio.py --help
          python apps/ClassRoomSTORM_VirtualExperiment.py --help
          python apps/ClassRoomSTORM_Reconstruction.py --help
      - name: Verify source export and user packages
        if: runner.os == 'Linux'
        run: |
          python tools/prepare_github_release.py --output ../ci-release
          python tools/prepare_github_release.py --validate-source ../ci-release/ClassRoomSTORM_Source
          python tools/build_user_packages.py --validate --output-dir ../ci-release
